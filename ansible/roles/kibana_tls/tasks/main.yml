---
# tasks file for kibana_tls
#
# Obtains (and, via certbot's own systemd timer, keeps renewed) a Let's
# Encrypt certificate for Kibana's public URL. DNS-01 via the
# certbot-dns-cloudflare plugin — required because Kibana has no public
# port 80/443 exposure for an HTTP-01 challenge; the ACME TXT record
# lands in Cloudflare regardless of where the A record itself is hosted.
#
# Runs on the host (apt package + systemd timer), not in a container: this
# is a recurring, scheduled job (Trivy's shape, ADR-7 in
# packer/ubuntu-26.04/README.md — apt + host timer), not a one-shot
# generate-once tool invocation (es_certs's shape). Keeping it host-side
# also means the renewal deploy-hook can call `docker compose restart
# kibana` directly, with no need to mount the Docker socket into a
# container just to reach a sibling container.

- name: Install certbot + Cloudflare DNS plugin
  ansible.builtin.apt:
    name:
      - certbot
      - python3-certbot-dns-cloudflare
    state: present
  become: true

- name: Ensure Kibana project + certs directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ elastic_base_dir }}/kibana"
    - "{{ elastic_base_dir }}/kibana/certs"
  become: true

- name: Render Cloudflare DNS API token credentials file
  ansible.builtin.template:
    src: cloudflare.ini.j2
    dest: /etc/letsencrypt/cloudflare.ini
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true

- name: Render certbot deploy-hook script
  ansible.builtin.template:
    src: certbot-deploy-hook.sh.j2
    dest: "{{ elastic_base_dir }}/kibana/certbot-deploy-hook.sh"
    owner: root
    group: root
    mode: "0750"
  become: true

- name: Request/renew the Kibana Let's Encrypt certificate
  ansible.builtin.command:
    argv:
      - certbot
      - certonly
      - --dns-cloudflare
      - --dns-cloudflare-credentials
      - /etc/letsencrypt/cloudflare.ini
      - --dns-cloudflare-propagation-seconds
      - "30"
      - -d
      - "{{ kibana_fqdn }}"
      - --non-interactive
      - --agree-tos
      - -m
      - "{{ letsencrypt_email }}"
      - --deploy-hook
      - "{{ elastic_base_dir }}/kibana/certbot-deploy-hook.sh"
  register: _certbot
  changed_when: "'Successfully received certificate' in _certbot.stdout"
  become: true
