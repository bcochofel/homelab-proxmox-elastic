---
# File: asserts.yml - preflight checks

- name: Debug OS
  ansible.builtin.debug:
    msg: "{{ ansible_os_family }} > {{ ansible_distribution }} {{ ansible_distribution_version }}"

- name: Check distribution compatibility
  ansible.builtin.fail:
    msg: "{{ ansible_distribution }} is not supported by this role"
  when: ansible_distribution not in ['Ubuntu']

- name: Fail if not a supported release of Ubuntu
  ansible.builtin.fail:
    msg: "{{ ansible_distribution_version }} is not a supported version for this role"
  when: ansible_distribution == "Ubuntu" and ansible_distribution_version is version_compare(22.04, '<')

- name: Verify Docker is installed (baked by Packer template)
  ansible.builtin.command: docker --version
  register: _docker_check
  changed_when: false
  failed_when: _docker_check.rc != 0

- name: Verify Docker Compose plugin is installed
  ansible.builtin.command: docker compose version
  register: _compose_check
  changed_when: false
  failed_when: _compose_check.rc != 0

- name: Verify security passwords are available (Phase 2 preflight)
  ansible.builtin.assert:
    that:
      - es_elastic_password | length > 0
      - kibana_system_password | length > 0
    fail_msg: >-
      es_security_enabled is true but ELASTIC_PASSWORD/KIBANA_SYSTEM_PASSWORD
      resolved empty. Add them to secrets.yaml, export from ansible/.envrc,
      then `direnv allow ansible` — see docs/ANSIBLE.md.
  when: es_security_enabled | bool

- name: Verify Cloudflare API token is available (Kibana Let's Encrypt preflight)
  ansible.builtin.assert:
    that:
      - cloudflare_api_token | length > 0
    fail_msg: >-
      kibana_tls_enabled is true but CLOUDFLARE_API_TOKEN resolved empty.
      Add it to secrets.yaml, export from ansible/.envrc, then
      `direnv allow ansible` — see docs/ANSIBLE.md.
  when: "'kibana' in group_names and kibana_tls_enabled | default(false) | bool"

- name: Verify Kibana encryption key is available (Fleet Server preflight)
  ansible.builtin.assert:
    that:
      - kibana_encryption_key | length > 0
    fail_msg: >-
      fleet_server_enabled is true but KIBANA_ENCRYPTION_KEY resolved
      empty. Generate one (e.g. `openssl rand -hex 32`), add it to
      secrets.yaml, export from ansible/.envrc, then `direnv allow
      ansible` — see docs/ANSIBLE.md.
  when: "'kibana' in group_names and fleet_server_enabled | default(false) | bool"
