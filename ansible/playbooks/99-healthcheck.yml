---
- name: Cluster health gate
  hosts: elasticsearch[0]
  gather_facts: false
  tasks:
    - name: Wait for cluster health to be green
      ansible.builtin.uri:
        url: "http://localhost:{{ es_http_port }}/_cluster/health"
        return_content: true
      register: _health
      until: >
        _health.status == 200 and
        (_health.json.status == 'green') and
        (_health.json.number_of_nodes == (groups['elasticsearch'] | length))
      retries: 30
      delay: 10

    - name: Show cluster health
      ansible.builtin.debug:
        msg: >
          cluster={{ _health.json.cluster_name }}
          status={{ _health.json.status }}
          nodes={{ _health.json.number_of_nodes }}

- name: Kibana reachability
  hosts: kibana
  gather_facts: false
  tasks:
    - name: Wait for Kibana API status
      ansible.builtin.uri:
        url: "http://localhost:{{ kibana_port }}/api/status"
        return_content: true
      register: _kb
      until: _kb.status == 200
      retries: 30
      delay: 10

- name: APM Server reachability
  hosts: apm_server
  gather_facts: false
  tasks:
    - name: Wait for APM Server root endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ apm_server_port }}/"
        return_content: true
      register: _apm
      until: _apm.status == 200
      retries: 30
      delay: 10

- name: OTel demo reachability
  hosts: otel_demo
  gather_facts: false
  tasks:
    - name: Wait for the demo frontend (via frontend-proxy) to respond
      ansible.builtin.uri:
        url: "http://localhost:8080/"
        status_code: [200, 301, 302]
      register: _otel
      until: _otel.status in [200, 301, 302]
      retries: 30
      delay: 10
