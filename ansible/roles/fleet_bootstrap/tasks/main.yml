---
# tasks file for fleet_bootstrap
#
# Runs once, hosts: kibana, only when fleet_server_enabled. Scripts the
# same Kibana Fleet setup a human would otherwise click through the UI
# wizard for — Fleet Server's own setup (POST /api/fleet/setup, agent
# policy, host registration, ES service token), plus (Phase 3 steps 2+3)
# the two agent policies and package policies the six Elastic Agents and
# the APM integration migrate onto, and their enrollment tokens — all via
# ansible.builtin.uri, same idiom as es_security_bootstrap's API-key
# minting. Idempotent throughout: every create step is guarded by a
# GET-by-id check first, using fixed IDs instead of relying on name
# matching.
#
# force_basic_auth: true on every call — Kibana's API doesn't send a
# WWW-Authenticate challenge the way ES does, so ansible.builtin.uri's
# default lazy-auth flow never attaches credentials on the first request
# against it (verified empirically: 401 with no auth header sent at all).

- name: Wait for Kibana API status
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ kibana_port }}/api/status"
    validate_certs: false
    return_content: true
  register: _kb
  until: _kb.status == 200
  retries: 30
  delay: 10
  # ansible.builtin.uri doesn't support check mode at all (any invocation
  # is skipped under --check, not just mutating ones) — force this GET to
  # actually run since it's read-only and the two GET-by-id checks below
  # need it to have really happened.
  check_mode: false

- name: Initialize Fleet in Kibana (POST /api/fleet/setup — safe to re-run)
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ kibana_port }}/api/fleet/setup"
    method: POST
    timeout: "{{ fleet_bootstrap_api_timeout }}"
    validate_certs: false
    user: elastic
    password: "{{ es_elastic_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
    body_format: json
    body: {}
    status_code: 200
  no_log: true

# POST /api/fleet/setup auto-creates a default output ("fleet-default-output")
# pointed at plain http://localhost:9200 — wrong for this cluster (HTTPS,
# security on, three real ES nodes, self-signed internal CA). Every
# Fleet-managed agent's data ships through whichever output its policy
# resolves to, and agent policies default to the account-wide default
# output when they don't set their own data_output_id — so every agent
# enrolled so far was silently trying plain HTTP against its own
# localhost:9200 and failing. Confirmed empirically: metrics-system.*/
# metrics-docker.* data streams never got created at all, and a plain
# HTTP GET to a real ES node's HTTPS-only port gets "Empty reply from
# server" — the exact shape of the "EOF" errors agents reported.
# PUT is safe to always re-run, same "safe to re-run" idiom as
# POST /api/fleet/setup above.
- name: Point Fleet's default output at the real ES cluster over HTTPS
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ kibana_port }}/api/fleet/outputs/fleet-default-output"
    method: PUT
    timeout: "{{ fleet_bootstrap_api_timeout }}"
    validate_certs: false
    user: elastic
    password: "{{ es_elastic_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
    body_format: json
    body:
      name: default
      type: elasticsearch
      hosts: >-
        {{ groups['elasticsearch']
           | map('extract', hostvars, 'ansible_host')
           | map('regex_replace', '^', 'https://')
           | map('regex_replace', '$', ':' ~ es_http_port)
           | list }}
      ssl:
        certificate_authorities:
          - "{{ lookup('file', es_certs_local_cache_dir ~ '/ca.crt') }}"
    status_code: 200
  no_log: true

- name: Check for an existing Fleet Server agent policy
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ kibana_port }}/api/fleet/agent_policies/{{ fleet_server_policy_id }}"
    validate_certs: false
    user: elastic
    password: "{{ es_elastic_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: _fleet_policy_check
  no_log: true
  check_mode: false

- name: Create the Fleet Server agent policy
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ kibana_port }}/api/fleet/agent_policies?sys_monitoring=false"
    method: POST
    timeout: "{{ fleet_bootstrap_api_timeout }}"
    validate_certs: false
    user: elastic
    password: "{{ es_elastic_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
    body_format: json
    body:
      id: "{{ fleet_server_policy_id }}"
      name: "Fleet Server Policy"
      namespace: default
      has_fleet_server: true
      is_default_fleet_server: true
      monitoring_enabled: [logs, metrics]
    status_code: 200
  when: _fleet_policy_check.status == 404
  no_log: true

# PUT (unlike the create-if-missing POST above) is safe to always re-run,
# same idiom as the output config fix above — retrofits monitoring_enabled
# onto a policy that already existed before this was added. PUT requires
# the full body (name/namespace included), not a partial patch — confirmed
# against the API docs, not assumed.
- name: Ensure agent monitoring (logs + metrics) is enabled on the Fleet Server policy
  ansible.builtin.uri:
