    timeout: "{{ fleet_bootstrap_api_timeout }}"
    validate_certs: false
    user: elastic
    password: "{{ es_elastic_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
    body_format: json
    body:
      id: system-homelab-agents
      name: system-homelab-agents
      policy_ids: ["{{ homelab_agents_policy_id }}"]
      package:
        name: system
        version: "{{ (_fleet_package_lookup.results | selectattr('item', 'equalto', 'system') | first).json.item.version }}"
      inputs: {}
    status_code: 200
  when: _pkgpolicy_system_homelab_check.status == 404
  no_log: true

