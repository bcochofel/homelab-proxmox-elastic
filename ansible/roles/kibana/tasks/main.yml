---
# tasks file for kibana

- name: Create Kibana project directory
  ansible.builtin.file:
    path: "{{ elastic_base_dir }}/kibana"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become: true

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ elastic_base_dir }}/kibana/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  become: true
  notify: Restart kibana

- name: Render .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ elastic_base_dir }}/kibana/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"
  become: true
  no_log: "{{ es_security_enabled | bool or (fleet_server_enabled | default(false) | bool) }}"
  notify: Restart kibana

- name: Bring up Kibana
  community.docker.docker_compose_v2:
    project_src: "{{ elastic_base_dir }}/kibana"
    state: present
  become: true
