---
repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: check-merge-conflict
      - id: no-commit-to-branch

  # Packer formatting and validation (local: no maintained hook repo exists
  # for Packer HCL, so these shell out directly to the `packer` binary
  # already required by this project — same tool, no extra supply chain)
  - repo: local
    hooks:
      - id: packer_fmt
        name: packer fmt -check
        description: Checks Packer HCL files are canonically formatted
        language: system
        entry: bash -c 'set -e; for d in packer/*/; do packer fmt -check -diff "$d"; done'
        files: ^packer/.*\.(pkr|pkrvars)\.hcl$
        pass_filenames: false

      - id: packer_validate
        name: packer validate -syntax-only
        description: Syntax-checks Packer templates (no variables required)
        language: system
        entry: bash -c 'set -e; for d in packer/*/; do packer validate -syntax-only "$d"; done'
        files: ^packer/.*\.(pkr|pkrvars)\.hcl$
        pass_filenames: false

