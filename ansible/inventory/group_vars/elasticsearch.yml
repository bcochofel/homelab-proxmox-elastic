---
# Elasticsearch role tuning (hand-authored).
# cluster_name, es_seed_hosts, es_initial_master_nodes come from the generated
# inventory vars (Terraform-derived). Everything else is yours to tune.

# Memory lock — pair bootstrap.memory_lock with the memlock ulimit in compose,
# or ES refuses to start.
es_bootstrap_memory_lock: true

# Single bootstrap toggle. true emits initial_master_nodes for first cluster
# formation; false is safe steady state.
#
# Checked-in value is false, matching this homelab's already-bootstrapped,
# steady-state cluster (see docs/ANSIBLE.md's Bootstrap lifecycle section) —
# it is NOT the correct starting value for a brand-new cluster. Bootstrapping
# one from scratch (fresh ES data volumes, no existing cluster state) means
# overriding this on the CLI for that one run instead of editing this file:
#   ansible-playbook playbooks/site.yml -e es_bootstrap_cluster=true
# Confirm the cluster reaches green, then re-run without the override — this
# checked-in false is already correct for steady state. Running with false
# against data volumes that have never formed a cluster will not bootstrap it.
es_bootstrap_cluster: false

# Data Stream Lifecycle retention applied to logs-*/metrics-*/traces-apm*
# by the es_data_lifecycle role (playbooks/55-data-retention.yml) — the
# actual bound on disk growth, on top of the data disk being sized
# generously (see packer/ubuntu-26.04/README.md's ADR-9). Any value
# Elasticsearch's data_retention accepts (e.g. "7d", "30d").
es_data_retention: "7d"
