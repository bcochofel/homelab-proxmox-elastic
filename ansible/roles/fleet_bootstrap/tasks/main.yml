# inputs: {} takes every stream at whatever Fleet ships enabled by default
# for this package (kubelet, kube-state-metrics, events, container logs —
# confirmed against the package's own manifest.yml, not assumed; apiserver/
# proxy/scheduler/controllermanager/audit-logs are the streams with no
# self-sufficient default and are left at Fleet's own off-by-default). The
# kube-state-metrics stream will sit enabled-but-empty until
# kube-state-metrics is actually deployed on the K3s side — same
# "scaffolded now, functional once the other side lands" shape as every
# other cross-repo dependency here (see kubernetes_agent_policy_id above).
- name: Check for an existing Kubernetes package policy on the Kubernetes agent policy
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ kibana_port }}/api/fleet/package_policies/kubernetes-kubernetes-agent"
    validate_certs: false
    user: elastic
    password: "{{ es_elastic_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: _pkgpolicy_kubernetes_check
  no_log: true
  check_mode: false

- name: Create the Kubernetes package policy on the Kubernetes agent policy
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ kibana_port }}/api/fleet/package_policies"
    method: POST
    timeout: "{{ fleet_bootstrap_api_timeout }}"
    validate_certs: false
    user: elastic
    password: "{{ es_elastic_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
    body_format: json
    body:
      id: kubernetes-kubernetes-agent
      name: kubernetes-kubernetes-agent
      policy_ids: ["{{ kubernetes_agent_policy_id }}"]
      package:
        name: kubernetes
        version: "{{ (_fleet_package_lookup.results | selectattr('item', 'equalto', 'kubernetes') | first).json.item.version }}"
      inputs: {}
    status_code: 200
  when: _pkgpolicy_kubernetes_check.status == 404
  no_log: true

- name: Ensure secrets cache directory exists
  ansible.builtin.file:
    path: "{{ es_secrets_local_cache_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Check for cached Fleet Server service token
  ansible.builtin.stat:
    path: "{{ es_secrets_local_cache_dir }}/fleet_server_service_token.txt"
  delegate_to: localhost
  become: false
  register: _fleet_token_cached

- name: Mint the elastic/fleet-server service account token
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ es_http_port }}/_security/service/elastic/fleet-server/credential/token/fleet-server-token"
    method: POST
    timeout: "{{ fleet_bootstrap_api_timeout }}"
    user: elastic
    password: "{{ es_elastic_password }}"
    force_basic_auth: true
    ca_path: "{{ elastic_base_dir }}/elasticsearch/certs/ca.crt"
    status_code: 200
  register: _fleet_token
  delegate_to: "{{ groups['elasticsearch'][0] }}"
  no_log: true
  when: not _fleet_token_cached.stat.exists

- name: Cache the Fleet Server service token
  ansible.builtin.copy:
    content: "{{ _fleet_token.json.token.value }}"
    dest: "{{ es_secrets_local_cache_dir }}/fleet_server_service_token.txt"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
  # ansible_check_mode guard: the mint task above is a POST, correctly
  # skipped under --check (mutations shouldn't run in dry-run) — but that
  # leaves _fleet_token as an empty skip result on a from-scratch --check
  # run (no cache yet), which .json.token.value can't dereference. Real
  # runs are unaffected — the mint task actually executes there.
  when: not _fleet_token_cached.stat.exists and not ansible_check_mode

