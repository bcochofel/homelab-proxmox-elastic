---
- name: Cluster health gate
  hosts: elasticsearch[0]
  gather_facts: false
  tasks:
    - name: Wait for cluster health to be green
      ansible.builtin.uri:
        url: "{{ 'https' if (es_security_enabled | bool) else 'http' }}://127.0.0.1:{{ es_http_port }}/_cluster/health"
        user: "{{ 'elastic' if (es_security_enabled | bool) else omit }}"
        password: "{{ es_elastic_password if (es_security_enabled | bool) else omit }}"
        ca_path: "{{ (elastic_base_dir ~ '/elasticsearch/certs/ca.crt') if (es_security_enabled | bool) else omit }}"
        return_content: true
      register: _health
      until: >
        _health.status == 200 and
        (_health.json.status == 'green') and
        (_health.json.number_of_nodes == (groups['elasticsearch'] | length))
      retries: 30
      delay: 10

    - name: Show cluster health
      ansible.builtin.debug:
        msg: >
          cluster={{ _health.json.cluster_name }}
          status={{ _health.json.status }}
          nodes={{ _health.json.number_of_nodes }}

- name: Kibana reachability
  hosts: kibana
  gather_facts: false
  tasks:
    - name: Wait for Kibana API status
      ansible.builtin.uri:
        url: "{{ 'https' if (kibana_tls_enabled | default(false) | bool) else 'http' }}://127.0.0.1:{{ kibana_port }}/api/status"
        validate_certs: "{{ not (kibana_tls_enabled | default(false) | bool) }}"
        return_content: true
      register: _kb
      until: _kb.status == 200
      retries: 30
      delay: 10

- name: Fleet Server reachability
  hosts: kibana
  gather_facts: false
  tasks:
    - name: Wait for Fleet Server status
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ fleet_server_port }}/api/status"
        ca_path: "{{ elastic_base_dir }}/fleet-server/certs/ca.crt"
        return_content: true
      register: _fleet
      until: _fleet.status == 200
      retries: 30
      delay: 10
      when: fleet_server_enabled | default(false) | bool

- name: APM Server reachability
  hosts: apm_server
  gather_facts: false
  tasks:
    - name: Wait for APM Server root endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ apm_server_port }}/"
        return_content: true
      register: _apm
      until: _apm.status == 200
      retries: 30
      delay: 10
