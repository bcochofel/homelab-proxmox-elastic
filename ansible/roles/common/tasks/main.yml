---
# tasks file for common — preflight checks for a Packer-provisioned host.
# sysctl, ulimits, and the compose base directory are baked into the
# Packer template (see packer/ubuntu-24.04/http/user-data.yml.tpl); this
# role only verifies the host is ready before ES/kibana render compose files.

- name: Include checks/asserts
  ansible.builtin.include_tasks: asserts.yml
