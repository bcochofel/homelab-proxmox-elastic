---
# Kibana role tuning (hand-authored).
# Derives the ES endpoint list from the elasticsearch group at template time.

# ---- Let's Encrypt TLS (kibana_tls role) ----
# DNS-01 via Cloudflare — kibana_fqdn already resolves to this VM's IP via
# the on-prem DNS server; the Cloudflare API token is only used to write
# the _acme-challenge TXT record during issuance/renewal, independent of
# where the A record itself is hosted. See docs/ANSIBLE.md.
kibana_fqdn: kibana.homelab.bcochofel.com
kibana_tls_enabled: true
letsencrypt_email: bruno.cochofel@gmail.com
cloudflare_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"

# Host-published port. 443 once TLS is on, for a clean https://kibana_fqdn
# URL with no port suffix.
kibana_port: 443

kibana_publicbaseurl: "https://{{ kibana_fqdn }}"

# ---- Fleet (Phase 3 — fleet_bootstrap/fleet_server roles) ----
# fleet_server_port, homelab_agents_policy_id, and apm_server_agent_policy_id
# live in group_vars/all.yml instead, alongside the other cross-host-visible
# ports/IDs — the elastic_agent role (hosts: all) needs to see them too, not
# just the kibana host these roles themselves run on.
fleet_server_enabled: true
fleet_server_policy_id: fleet-server-policy
fleet_server_host_id: fleet-server-default

# Fleet encrypts the service tokens/API keys it stores as saved objects
# with this key (xpack.encryptedSavedObjects.encryptionKey) — required for
# POST /api/fleet/setup to succeed at all, verified empirically against a
# live Kibana ("Agent binary source needs encrypted saved object api key
# to be set" otherwise). Human-chosen, like ELASTIC_PASSWORD/
# KIBANA_SYSTEM_PASSWORD — generate with e.g. `openssl rand -hex 32`, add
# to secrets.yaml as KIBANA_ENCRYPTION_KEY, export from ansible/.envrc.
kibana_encryption_key: "{{ lookup('env', 'KIBANA_ENCRYPTION_KEY') }}"
