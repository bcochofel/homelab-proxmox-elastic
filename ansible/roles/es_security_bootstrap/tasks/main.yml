---
# tasks file for es_security_bootstrap
#
# Runs once, immediately after ES comes up with xpack.security enabled (see
# playbooks/15-elasticsearch-security.yml, hosts: elasticsearch[0]). Sets
# the built-in kibana_system user's password — Kibana never uses the
# elastic superuser.
#
# The APM Server and standalone-Elastic-Agent API key minting this role
# used to also do here is gone (Phase 3 steps 2+3): every agent is
# Fleet-managed now and gets its ES output credentials from Fleet
# enrollment instead (see fleet_bootstrap's enrollment-token minting and
# the Fleet output config it pushes) — there's no standalone credential
# left to mint or cache.

- name: Wait for secured cluster health
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ es_http_port }}/_cluster/health"
    user: elastic
    password: "{{ es_elastic_password }}"
    ca_path: "{{ elastic_base_dir }}/elasticsearch/certs/ca.crt"
    return_content: true
  register: _health
  until: >-
    _health.status == 200 and
    _health.json.status in ['green', 'yellow'] and
    _health.json.number_of_nodes == (groups['elasticsearch'] | length)
  retries: 30
  delay: 10

- name: Set kibana_system password
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ es_http_port }}/_security/user/kibana_system/_password"
    method: POST
    user: elastic
    password: "{{ es_elastic_password }}"
    ca_path: "{{ elastic_base_dir }}/elasticsearch/certs/ca.crt"
    body_format: json
    body:
      password: "{{ kibana_system_password }}"
    status_code: 200
  no_log: true
