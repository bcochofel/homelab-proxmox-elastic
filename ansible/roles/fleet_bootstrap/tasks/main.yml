# Package versions are looked up live rather than pinned here — they drift
# independently of stack_version (system 2.22.1, docker 2.15.2 as of this
# writing; apm tracks stack_version, e.g. 9.4.2). A loop is safe for this
# part (unlike the package policies below): each iteration is completely
# self-contained, same shape, no cross-loop index correlation needed.
- name: Look up current version of each Fleet integration package
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ kibana_port }}/api/fleet/epm/packages/{{ item }}"
    validate_certs: false
    user: elastic
    password: "{{ es_elastic_password }}"
    force_basic_auth: true
    status_code: 200
  loop: [system, docker, apm, kubernetes]
  register: _fleet_package_lookup
  no_log: true
  check_mode: false

- name: Install Fleet integration packages not yet installed
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ kibana_port }}/api/fleet/epm/packages/{{ item.item }}/{{ item.json.item.version }}"
    method: POST
    timeout: "{{ fleet_bootstrap_api_timeout }}"
    validate_certs: false
    user: elastic
    password: "{{ es_elastic_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
    body_format: json
    body: {}
    status_code: 200
  loop: "{{ _fleet_package_lookup.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.json.item.status != 'installed'
  no_log: true

# Package policies (integrations attached to an agent policy) are written
# out individually rather than looped, deliberately — unlike the package
# install step above, these are heterogeneous (different target policy,
# different input overrides for apm) and each needs its own idempotent
# GET-by-id check; correlating a create-loop back to a separate check-loop
# by index is a real footgun (one silent off-by-one and you double-create
# or skip). Explicit named tasks keep each one trivially reviewable.
#
# inputs: {} everywhere except apm's host override — Fleet's own default
# integration config otherwise (confirmed with the user: simpler and more
# maintainable than hand-replicating today's exact standalone metricsets
# via a version-fragile package-policy schema). apm's default `host` var
# is `localhost:8200` — loopback only, verified live against this
# cluster's own package registry — which would silently break OTLP export
# from other VMs, so that one var is explicitly overridden.

- name: Check for an existing System package policy on the homelab agents policy
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ kibana_port }}/api/fleet/package_policies/system-homelab-agents"
    validate_certs: false
    user: elastic
    password: "{{ es_elastic_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: _pkgpolicy_system_homelab_check
  no_log: true
  check_mode: false

- name: Create the System package policy on the homelab agents policy
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ kibana_port }}/api/fleet/package_policies"
